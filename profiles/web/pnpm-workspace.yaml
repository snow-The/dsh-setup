packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# Git-hosted plugins must run their build (prepare) script, and pnpm refuses unless each one is
# allowlisted. This list is NOT optional: a missing entry makes a fresh install die with
# ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED and leaves the plugin without its dist/.
#
# MAINTENANCE RULE — keep this list in sync with `dependencies` above:
#   * a missing entry breaks the install;
#   * an extra entry is harmless (a package with no build script is simply never asked).
# So when in doubt, include it. Do NOT paste `name@https://codeload.../tar.gz/<sha>` rows:
#   those were emitted by an older pnpm for ONE resolved install and go stale the moment the
#   repo moves. Bare names are what pnpm 10 wants, which is why this profile pins
#   packageManager to pnpm 10 — pnpm 11 changed the key format to the hashed form.
allowBuilds:
  # --- @snow-the/* (github: deps, each builds its own dist/) ---
  "@snow-the/dsh-acp-memory": true
  "@snow-the/dsh-browser": true
  "@snow-the/dsh-busyloop": true
  "@snow-the/dsh-eigenflux": true
  "@snow-the/dsh-gitkit": true
  "@snow-the/dsh-lib-analyzer": true
  "@snow-the/dsh-notemap": true
  "@snow-the/dsh-plugin-doctor": true
  "@snow-the/dsh-plugin-guide": true
  "@snow-the/dsh-research-lab": true
  "@snow-the/dsh-search": true
  "@snow-the/dsh-session-handoff": true
  "@snow-the/dsh-session-repair": true
  "@snow-the/dsh-skill-pack": true
  "@snow-the/dsh-snapshot": true
  "@snow-the/dsh-w8-sandbox": true
  # --- third-party plugins ---
  "@linxin666/dsh-session-archive": true
  "@linxin666/dsh-web-all": true
  "@mars-sea/dsh-commandcode-provider": true
  "@tt-a1i/archify-dsh": true
  "aegis": true
  "dsh-ark-plan": true
  "dsh-undo-savepoint": true
  "dshmarket": true
  # --- official layers that ship a build step ---
  "@deepseek-ai/dsh-experimental-agent-team-profile": true
  # --- build tooling used by the prepare scripts above ---
  "esbuild": true
  "typescript": true
  # --- native transitive deps of the UI bundle (yarn/pnpm treat these as build deps) ---
  "cloudflared": true
  "cpu-features": true
  "node-pty": true
  "ssh2": true
