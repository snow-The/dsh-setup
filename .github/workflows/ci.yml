name: build-and-test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 静态判据：推导自洽 + 模板自洽 + 两个变异自检
  # ---------------------------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 不要在这里再写 version: —— 那会和 package.json 的 packageManager 撞车，报
      # "Multiple versions of pnpm specified" 并在安装前就失败。
      # 2026-10-19 之前这个仓库的 CI 一直是红的，原因就是这一条：
      # 本机 `pnpm test` 全绿，所以从来没人发现 CI 根本没跑到测试那一步。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 仓库根故意不声明插件依赖，这一步只会校验根清单。
      - name: Install (root manifest only)
        run: pnpm install --no-frozen-lockfile

      - name: Template self-checks
        run: pnpm test

  # ---------------------------------------------------------------------------
  # 真实装配：把模板装成一份 profile，然后真的启动它
  #
  # 为什么必须有这一层（2026-10-19 实测）：
  #   `dsh --dump-config` 只【组合】YAML，不解析模块。注入一条引用不存在的模块的
  #   insert 声明，dump-config 的 stderr 仍然是 0 行，而真实启动会报
  #   `failed to import: ERR_MODULE_NOT_FOUND`。
  # 所以"能装"和"能跑"是两件事，必须分开证明。
  # ---------------------------------------------------------------------------
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the host this template targets
        run: npm install -g @deepseek-ai/dsh@0.2.1-rc.2

      - name: Deploy the template into a throwaway DSH_HOME
        env:
          # 见下方 ~/.npmrc 的说明。这里给一份小写形式作为双保险：
          # pnpm 在 Linux 上读的是小写 npm_config_*，而大写形式（NPM_CONFIG_*）不一定生效。
          npm_config_frozen_lockfile: 'false'
        run: |
          set -euo pipefail

          # git-hosted 插件在 prepare 阶段会跑自己的 `pnpm install`，而那个 install 发生在
          # 【临时克隆目录】里 —— profile 的 .npmrc 管不到它。所以要写到用户级 ~/.npmrc。
          #
          # 为什么需要：有些插件仓库的 pnpm-lock.yaml 已经和 package.json 脱节
          # （@snow-the/dsh-plugin-guide 加了 @deepseek-ai/dsh 依赖却没更新 lock）。
          # 本机安装时 pnpm 会静默更新 lock，但在 CI 里 frozen-lockfile 默认是 true，于是：
          #   ERR_PNPM_OUTDATED_LOCKFILE → ERR_PNPM_PREPARE_PACKAGE
          # 这不是模板的问题，是那些插件的仓库状态问题。真正的修法是让插件仓库的 lockfile
          # 与 package.json 一致，或者干脆不提交 lockfile（它们是要发布到 npm 的库，不是应用）。
          echo "frozen-lockfile=false" >> "$HOME/.npmrc"

          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          echo "DSH_HOME=$DSH_HOME" >> "$GITHUB_ENV"
          mkdir -p "$DSH_HOME/profiles/web"
          cp -a profiles/web/. "$DSH_HOME/profiles/web/"
          dsh --version
          # 这一步走宿主自己的兼容性判定，peer 不满足会整组拒绝并回滚。
          dsh plugin --profile web install

      - name: Boot check — prove it assembles and serves
        run: node scripts/boot-check.mjs --profile web --timeout 300
