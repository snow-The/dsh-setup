name: build-and-test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 静态判据：推导自洽 + 模板自洽 + 两个变异自检
  # ---------------------------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 不要在这里再写 version: —— 那会和 package.json 的 packageManager 撞车，报
      # "Multiple versions of pnpm specified" 并在安装前就失败。
      # 2026-10-19 之前这个仓库的 CI 一直是红的，原因就是这一条：
      # 本机 `pnpm test` 全绿，所以从来没人发现 CI 根本没跑到测试那一步。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 仓库根故意不声明插件依赖，这一步只会校验根清单。
      - name: Install (root manifest only)
        run: pnpm install --no-frozen-lockfile

      - name: Template self-checks
        run: pnpm test

  # ---------------------------------------------------------------------------
  # 真实装配：把模板装成一份 profile，然后真的启动它
  #
  # 为什么必须有这一层（2026-10-19 实测）：
  #   `dsh --dump-config` 只【组合】YAML，不解析模块。注入一条引用不存在的模块的
  #   insert 声明，dump-config 的 stderr 仍然是 0 行，而真实启动会报
  #   `failed to import: ERR_MODULE_NOT_FOUND`。
  # 所以"能装"和"能跑"是两件事，必须分开证明。
  # ---------------------------------------------------------------------------
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the host this template targets
        run: npm install -g @deepseek-ai/dsh@0.2.1-rc.2

      - name: Deploy the template into a throwaway DSH_HOME
        run: |
          set -euo pipefail

          # 这里【故意不】绕过 frozen-lockfile。
          #
          # 2026-10-19 排查记录：git-hosted 插件在 prepare 阶段会跑自己的 `pnpm install`，
          # 当时报
          #   ERR_PNPM_OUTDATED_LOCKFILE
          #     specifiers in the lockfile don't match specifiers in package.json
          #   * 1 dependencies were added: @deepseek-ai/dsh@>=0.2.0-rc.1
          #   → ERR_PNPM_PREPARE_PACKAGE
          # 根因在插件仓库：它们没有 pnpm 配置，pnpm 默认 auto-install-peers=true，把
          # peerDependencies 里的 @deepseek-ai/dsh* 真的装进依赖图；某次提交加了 peer 却没重建
          # lock，于是任何 frozen 安装都失败。本机 pnpm install 会静默更新 lock，所以本地
          # 永远看不见 —— 只有 CI 和 `dsh plugin install` 会撞上。
          #
          # 已修：15 个插件仓库全部加上 auto-install-peers=false 并重建了 lock。
          # 试过但无效的两种绕过（记下来免得下次重试）：
          #   env NPM_CONFIG_FROZEN_LOCKFILE=false   ← Linux 上 pnpm 读小写名
          #   echo frozen-lockfile=false >> ~/.npmrc ← prepare 的子进程不读这份
          #   unset CI                               ← 能绕过，但会掩盖同类缺陷复发
          # 所以现在保持默认：一旦某个插件仓库的 lock 再次脱节，这里就该红。

          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          echo "DSH_HOME=$DSH_HOME" >> "$GITHUB_ENV"
          mkdir -p "$DSH_HOME/profiles/web"
          cp -a profiles/web/. "$DSH_HOME/profiles/web/"
          dsh --version
          # 这一步走宿主自己的兼容性判定，peer 不满足会整组拒绝并回滚。
          dsh plugin --profile web install

      - name: Boot check — prove it assembles and serves
        run: node scripts/boot-check.mjs --profile web --timeout 300

      # 第三层：在【正确的宿主副本】上执行每个插件的模块初始化。
      #
      # 注意这里必须显式指定 --host：插件把 @deepseek-ai/* 声明为 peer，自己目录里没有；
      # Node 会一路向上查找，可能命中的是别处一份旧副本（本机就踩过：
      # 不加约束时解析到 npx 缓存里那份 dsh-tools@0.1.5-rc.3，也就是另一个世代）。
      # host-map.mjs 的钩子是【严格】的：映射不到直接报错，不回退；脚本还会自证
      # 解析结果确实落在 --host 里，否则退出 2。
      - name: Plugin load check — every plugin entry initialises against the installed host
        run: |
          set -euo pipefail
          HOST_NM="$(npm root -g)"
          # npm 的全局布局是扁平的（@deepseek-ai/* 直接在 node_modules 下）；
          # 若某个 npm 版本改成嵌套，这里兜一下，两种都试。
          if [ ! -d "$HOST_NM/@deepseek-ai/dsh-tools" ] && [ -d "$HOST_NM/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-tools" ]; then
            HOST_NM="$HOST_NM/@deepseek-ai/dsh/node_modules"
          fi
          echo "host node_modules: $HOST_NM"
          node scripts/plugin-load-check.mjs --profile web --host "$HOST_NM"
